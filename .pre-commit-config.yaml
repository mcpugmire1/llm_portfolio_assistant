# Pre-commit hooks for code quality
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Mypy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^(tests/|migrations/|ui/pages/ask_mattgpt\.py$)

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.txt)$
      - id: end-of-file-fixer
        exclude: ^(.*\.md|.*\.txt)$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-json
        exclude: ^\.devcontainer/
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  # Unit test suite (MATTGPT-216) -- runs on `git push`, not every commit.
  #
  # Install locally with: pre-commit install --hook-type pre-push
  #
  # Runs on push (not commit) because ~48s is too slow for every commit but
  # fine as a push gate. The eval suite (tests/eval_rag_quality.py) stays
  # as manual pre-push discipline -- it costs API tokens and takes ~4
  # minutes; automating both would push total gate time past the threshold
  # at which --no-verify becomes tempting. Pytest catches structural
  # regressions; the eval catches retrieval-quality regressions. Different
  # failure classes; keeping them at different gates preserves both.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest tests/unit + tests/integration (excluding network-bound)
        entry: python -m pytest tests/unit/ tests/integration/ -m "not network" -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
